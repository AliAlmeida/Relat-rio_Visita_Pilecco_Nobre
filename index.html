<style>
  :root {
    --paper: #FBF8F1;
    --card: #FFFFFF;
    --ink: #22281F;
    --ink-soft: #5C6055;
    --line: #E1D9C4;
    --gold: #B98A2E;
    --gold-dark: #8C6A22;
    --gold-tint: #F4E9D3;
    --green: #33513A;
    --green-tint: #E7EEE4;
    --danger: #9C3B3B;
    --danger-tint: #F6E7E7;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(34,40,31,0.08);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  body { padding-bottom: 96px; }
  h1, h2, h3 { margin: 0; font-weight: 700; }
  input, textarea, select {
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 10px;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--gold);
  }
  textarea { resize: vertical; min-height: 60px; line-height: 1.4; }
  label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field { margin-bottom: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1.2fr 1.5fr 1fr; gap: 10px; }

  header.top {
    position: sticky; top: 0; z-index: 20;
    background: var(--green);
    color: #F4F1E6;
    padding: 14px 16px 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  header.top .eyebrow {
    font-size: 12px;
    color: #C9D6C2;
    margin-bottom: 2px;
  }
  header.top h1 { font-size: 19px; letter-spacing: 0.2px; }

  main { max-width: 640px; margin: 0 auto; padding: 16px 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
  }
  .card > h2 {
    font-size: 15px;
    color: var(--green);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--green-tint);
  }

  .store {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    background: var(--card);
  }
  .store-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    background: var(--gold-tint);
    cursor: pointer;
  }
  .store-head .num {
    background: var(--gold);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .store-head .title {
    flex: 1;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--gold-dark);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .store-head .chev { color: var(--gold-dark); font-size: 13px; }
  .store-body { padding: 14px; border-top: 1px solid var(--line); }

  .icon-btn {
    border: none; background: transparent;
    color: var(--danger);
    font-size: 18px;
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .subsection { margin-top: 16px; }
  .subsection > .subhead {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 8px;
  }
  .entry {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
    margin-bottom: 8px;
  }
  .entry-top { display: flex; gap: 8px; align-items: flex-start; }
  .entry-top textarea, .entry-top input { flex: 1; }
  .photos-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .thumb { position: relative; width: 56px; height: 56px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .rm {
    position: absolute; top: -1px; right: -1px;
    background: rgba(156,59,59,0.92); color: #fff;
    width: 18px; height: 18px; border-radius: 50%;
    font-size: 12px; line-height: 18px; text-align: center;
    cursor: pointer;
  }
  .add-photo-btn {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--green);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 6px 10px;
    margin-top: 8px;
    cursor: pointer;
    background: var(--green-tint);
  }
  .add-photo-btn input { display: none; }

  .btn {
    display: inline-block;
    border: none; border-radius: var(--radius);
    padding: 9px 14px;
    font-size: 13.5px; font-weight: 600;
    cursor: pointer;
  }
  .btn-add {
    background: var(--green-tint); color: var(--green);
    border: 1px solid var(--green);
  }
  .btn-add-store {
    width: 100%;
    background: var(--card); color: var(--gold-dark);
    border: 1.5px dashed var(--gold);
    padding: 12px; font-size: 14px;
  }
  .btn-remove-entry {
    background: transparent; color: var(--danger);
    border: none; font-size: 13px; padding: 6px 4px;
  }

  footer.bottom {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 10px 14px;
    display: flex; justify-content: center;
    z-index: 20;
  }
  .btn-generate {
    background: var(--gold);
    color: #fff;
    width: 100%; max-width: 612px;
    padding: 14px; font-size: 15.5px; font-weight: 700;
    border-radius: var(--radius);
    box-shadow: 0 2px 6px rgba(140,106,34,0.35);
  }
  .btn-generate:disabled { opacity: 0.6; }
  .hint { font-size: 12px; color: var(--ink-soft); text-align: center; margin-top: 8px; }
  .status { font-size: 12.5px; text-align: center; margin-top: 8px; min-height: 16px; }
  .status.ok { color: var(--green); }
  .status.err { color: var(--danger); }
</style>
</head>
<body>

<header class="top">

  <h1>Registro do dia</h1>

<main>

</main>

</footer>

  function initGoogleAuth() {
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      setTimeout(initGoogleAuth, 300);

    tokenClient = google.accounts.oauth2.initTokenClient({

  function driveFetch(url, options) {
    options = options || {};
    options.headers = options.headers || {};
    options.headers['Authorization'] = 'Bearer ' + driveAccessToken;
    return fetch(url, options).then(function (res) {
      if (res.status === 401) {
        driveAccessToken = null;
        btnGoogleSignin.textContent = 'Entrar com Google';
        setDriveStatus('Sessão do Google expirou. Clique em "Entrar com Google" de novo.');
        throw new Error('token expirado');
      }
      return res;
    });
  }

  function findFileByName(name) {
    var q = encodeURIComponent("name = '" + name.replace(/'/g, "\\'") + "' and trashed = false");
    return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&spaces=drive&fields=files(id,name)')
      .then(function (res) { return res.json(); })
      .then(function (data) { return (data.files && data.files[0]) || null; });
  }

  function saveJSONFile(name, obj, existingId) {
    var boundary = 'foo_bar_baz_' + Math.random().toString(36).slice(2);
    var metadata = { name: name, mimeType: 'application/json' };
    var body = '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: application/json\r\n\r\n' +
      JSON.stringify(obj) + '\r\n' +
      '--' + boundary + '--';
    var url = existingId
      ? 'https://www.googleapis.com/upload/drive/v3/files/' + existingId + '?uploadType=multipart'
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    return driveFetch(url, {
      method: existingId ? 'PATCH' : 'POST',
      headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
      body: body
    }).then(function (res) { return res.json(); });
  }

  function buildDraftSnapshot() {

          precos: s.precos,
          alertas: s.alertas.map(function (a) { return { texto: a.texto, fotoCount: a.fotos.length }; }),
          oportunidades: s.oportunidades,
          leituraEstrategica: s.leituraEstrategica
        };

    };
  }

  function scheduleAutosave() {
    if (!driveAccessToken) return;
    clearTimeout(autosaveTimer);
    setDriveStatus('Alterações pendentes...');
    autosaveTimer = setTimeout(function () {
      setDriveStatus('Salvando rascunho...');
      var name = draftFileName();
      findFileByName(name).then(function (existing) {
        return saveJSONFile(name, buildDraftSnapshot(), existing ? existing.id : null);
      }).then(function () {
        var now = new Date();
        setDriveStatus('Rascunho salvo às ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + '.');
      }).catch(function (err) {
        console.error(err);
        setDriveStatus('Não consegui salvar o rascunho agora. Vai tentar de novo na próxima alteração.');

    }, 3000);

      if (temEntradaReal) return;
      return driveFetch('https://www.googleapis.com/drive/v3/files/' + existing.id + '?alt=media')

          state.meta = draft.meta || state.meta;

              observacoes: (s.observacoes || []).map(function (o) {

  function getOrCreateReportsFolder() {
    if (reportsFolderIdCache) return Promise.resolve(reportsFolderIdCache);
    var q = encodeURIComponent("name = '" + REPORTS_FOLDER_NAME + "' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
    return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&spaces=drive&fields=files(id,name)')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.files && data.files[0]) { reportsFolderIdCache = data.files[0].id; return reportsFolderIdCache; }
        return driveFetch('https://www.googleapis.com/drive/v3/files', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: REPORTS_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
        }).then(function (res) { return res.json(); }).then(function (folder) {
          reportsFolderIdCache = folder.id;
          return reportsFolderIdCache;
        });
      });

  function uploadDocxToDrive(blob, filename) {
    if (!driveAccessToken) return Promise.resolve(false);
    return getOrCreateReportsFolder().then(function (folderId) {
      return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify({ name: filename, parents: [folderId] })
      });
    }).then(function (initRes) {
      var uploadUrl = initRes.headers.get('Location');
      return fetch(uploadUrl, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' },
        body: blob
      });
    }).then(function (res) { return res.ok; })
      .then(function (ok) {
        if (ok) {
          return findFileByName(draftFileName()).then(function (existing) {
            if (existing) return driveFetch('https://www.googleapis.com/drive/v3/files/' + existing.id, { method: 'DELETE' });
          }).then(function () { return true; });
        }
        return false;
      }).catch(function (err) { console.error(err); return false; });
  }

  // ---------- image compression ----------
  function fileToImageEl(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () { resolve({ img: img, url: url }); };
      img.onerror = function (e) { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  function compressImage(file, maxDim, quality) {
    maxDim = maxDim || 1400;
    quality = quality || 0.75;
    return fileToImageEl(file).then(function (loaded) {
      var img = loaded.img;
      var scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      var w = Math.max(1, Math.round(img.naturalWidth * scale));
      var h = Math.max(1, Math.round(img.naturalHeight * scale));
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(loaded.url);
      return new Promise(function (resolve) {
        canvas.toBlob(function (blob) {
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          blob.arrayBuffer().then(function (buf) {
            resolve({ id: uid(), arrayBuffer: buf, width: w, height: h, dataUrl: dataUrl });
          });
        }, 'image/jpeg', quality);
      });
    });
  }

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  function textEl(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;

  function labeledInput(labelText, value, oninput, placeholder, type) {

  function renderPhotoAdder(onFiles) {
    function makeButton(text, useCameraCapture) {
      var label = el('label', { class: 'add-photo-btn' });
      label.textContent = text;
      var attrs = { type: 'file', accept: 'image/*', multiple: 'multiple' };
      if (useCameraCapture) attrs.capture = 'environment';
      var input = el('input', attrs);
      input.addEventListener('change', function (e) {
        var files = Array.prototype.slice.call(e.target.files || []);
        if (!files.length) return;
        label.textContent = 'Processando...';
        Promise.all(files.map(function (f) { return compressImage(f); })).then(function (fotos) {
          onFiles(fotos);
          label.textContent = text;
          input.value = '';
        });
      });
      label.appendChild(input);
      return label;
    }
    var wrap = el('div', { style: 'display:flex; gap:8px; flex-wrap:wrap;' });

  // ---------- docx generation ----------
  function slug(s) {
    return (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'relatorio';
  }

  function formatDataBR(iso) {
    if (!iso) return '';
    var parts = iso.split('-');
    if (parts.length !== 3) return iso;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function buildPhotosParagraph(D, fotos) {
    var n = fotos.length;
    if (!n) return null;
    var maxTotal = 600;
    var perW = Math.min(420, Math.floor(maxTotal / n) - 8);
    var children = [];
    fotos.forEach(function (foto, i) {
      var w = Math.min(perW, foto.width);
      var h = Math.round(w * (foto.height / foto.width));
      children.push(new D.ImageRun({ data: foto.arrayBuffer, transformation: { width: w, height: h }, type: 'jpg' }));
      if (i < n - 1) children.push(new D.TextRun({ text: '   ' }));
    });
    return new D.Paragraph({ children: children, alignment: D.AlignmentType.CENTER, spacing: { after: 160 } });
  }

  function buildDocx() {
    var D = window.docx;
    var children = [];

    // Title
    children.push(new D.Paragraph({
      children: [new D.TextRun({ text: 'RELATÓRIO DE VISITA — ' + (state.meta.marca || '').toUpperCase(), bold: true, size: 32 })],
      alignment: D.AlignmentType.CENTER,
      spacing: { after: 200 }
    }));

    function metaLine(label, value) {
      return new D.Paragraph({
        children: [
          new D.TextRun({ text: label + ': ', bold: true, size: 22 }),
          new D.TextRun({ text: value || '-', size: 22 })
        ],
        spacing: { after: 40 }
      });
    }
    children.push(metaLine('Data', formatDataBR(state.meta.data)));
    children.push(metaLine('Responsável', state.meta.responsavel));
    children.push(metaLine('Cidade/Região', state.meta.cidadeRegiao));
    children.push(metaLine('Setor', state.meta.setor));
    children.push(new D.Paragraph({ text: '', spacing: { after: 200 } }));

    state.stores.forEach(function (store, idx) {
      var contatoParts = [];
      if (store.contatoCargo || store.contatoNome) {
        var c = 'Contato';
        if (store.contatoCargo) c += ' ' + store.contatoCargo;
        if (store.contatoNome) c += ': ' + store.contatoNome;
        if (store.contatoTelefone) c += ' (' + store.contatoTelefone + ')';
        contatoParts.push(c);
      }
      var headingText = (idx + 1) + '. ' + (store.nome || 'SEM NOME').toUpperCase() +
        (contatoParts.length ? '  ' + contatoParts.join(' ') : '');

      children.push(new D.Paragraph({
        children: [new D.TextRun({ text: headingText, bold: true, size: 26, color: '33513A' })],
        spacing: { before: 240, after: 120 },
        border: { bottom: { color: 'E7EEE4', space: 4, style: D.BorderStyle.SINGLE, size: 8 } }
      }));

      function subhead(text) {
        children.push(new D.Paragraph({
          children: [new D.TextRun({ text: text, bold: true, size: 22 })],
          spacing: { before: 160, after: 80 }
        }));
      }

      if (store.observacoes.some(function (o) { return o.texto || o.fotos.length; })) {
        subhead('Ações e observações');
        store.observacoes.forEach(function (o) {
          if (!o.texto && !o.fotos.length) return;
          if (o.texto) children.push(new D.Paragraph({ text: o.texto, spacing: { after: 80 } }));
          var photoPara = buildPhotosParagraph(D, o.fotos);
          if (photoPara) children.push(photoPara);
        });
      }

      if (store.precos.length) {
        subhead('Preços');
        store.precos.forEach(function (p) {
          if (!p.produto && !p.valor) return;
          var runs = [
            new D.TextRun({ text: (p.produto || '') + ': ', bold: true }),
            new D.TextRun({ text: p.valor || '' })
          ];
          if (p.oferta) runs.push(new D.TextRun({ text: '  OFERTA', bold: true, color: 'B98A2E' }));
          children.push(new D.Paragraph({ children: runs, spacing: { after: 40 } }));
        });
      }

      if (store.alertas.some(function (a) { return a.texto || a.fotos.length; })) {
        subhead('Alertas');
        store.alertas.forEach(function (a) {
          if (!a.texto && !a.fotos.length) return;
          if (a.texto) children.push(new D.Paragraph({ text: a.texto, numbering: { reference: 'bullet-list', level: 0 }, spacing: { after: 80 } }));
          var photoPara = buildPhotosParagraph(D, a.fotos);
          if (photoPara) children.push(photoPara);
        });
      }

      if (store.oportunidades.some(function (o) { return o.texto; })) {
        subhead('Oportunidades');
        store.oportunidades.forEach(function (o) {
          if (!o.texto) return;
          children.push(new D.Paragraph({ text: o.texto, numbering: { reference: 'bullet-list', level: 0 }, spacing: { after: 80 } }));
        });
      }

      if (store.leituraEstrategica && store.leituraEstrategica.trim()) {
        subhead('Leitura estratégica');
        store.leituraEstrategica.split('\n').forEach(function (line) {
          if (line.trim()) children.push(new D.Paragraph({ text: line, spacing: { after: 80 } }));
        });
      }
    });

    var doc = new D.Document({
      numbering: {
        config: [{
          reference: 'bullet-list',
          levels: [{
            level: 0,
            format: D.LevelFormat.BULLET,
            text: '•',
            alignment: D.AlignmentType.LEFT,
            style: { paragraph: { indent: { left: 360, hanging: 360 } } }
          }]
        }]
      },
      sections: [{ properties: {}, children: children }]
    });

    return D.Packer.toBlob(doc);
  }

  function gerarRelatorio() {
    var btn = document.getElementById('btn-generate');
    btn.disabled = true;
    statusEl.className = 'status';
    statusEl.textContent = 'Gerando documento...';
    buildDocx().then(function (blob) {
      var filename = 'Relatorio_Visita_' + slug(state.meta.cidadeRegiao) + '_' + (state.meta.data || todayISO()) + '.docx';
      window.saveAs(blob, filename);
      statusEl.className = 'status ok';
      statusEl.textContent = 'Relatório gerado: ' + filename;
      btn.disabled = false;
      if (driveAccessToken) {
        statusEl.textContent += ' — enviando cópia pro Drive...';
        uploadDocxToDrive(blob, filename).then(function (ok) {
          statusEl.textContent = 'Relatório gerado: ' + filename + (ok ? ' (salvo no Drive também)' : ' (não consegui salvar no Drive)');
        });
      }
    }).catch(function (err) {
      console.error(err);
      statusEl.className = 'status err';
      statusEl.textContent = 'Erro ao gerar o relatório. Tente novamente.';
      btn.disabled = false;
    });
  }

  document.getElementById('btn-generate').addEventListener('click', function () {
    if (!state.stores.length) {
      statusEl.className = 'status err';
      statusEl.textContent = 'Adicione ao menos uma loja antes de gerar o relatório.';
      return;
    }
    if (librariesReady) {
      gerarRelatorio();
      return;
    }
    statusEl.className = 'status';
    statusEl.textContent = 'Tentando carregar os componentes novamente...';
    initLibraries().then(function () {
      if (librariesReady) {
        gerarRelatorio();
      } else {
        statusEl.className = 'status err';
        statusEl.textContent = 'Ainda não consegui carregar os componentes. Verifique sua internet e tente novamente.';
      }
    });
  });

  // ---------- init ----------
  renderMeta();
  state.stores.push(newStore());
  renderStores();
  initLibraries();
  initGoogleAuth();
})();
</script>
</body>
</html>
