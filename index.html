<style>
  :root {
    --paper: #FBF8F1;
    --card: #FFFFFF;
    --ink: #22281F;
    --ink-soft: #5C6055;
    --line: #E1D9C4;
    --gold: #D9A600;
    --gold-dark: #8C7300;
    --gold-tint: #F4E9D3;
    --navy: #0A3679;
    --navy-tint: #E3E9F4;
    --red: #E20719;
    --red-dark: #A6050F;
    --danger: var(--red);
    --danger-tint: #FBE4E7;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(34,40,31,0.08);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  body { padding-bottom: 96px; }
  h1, h2, h3 { margin: 0; font-weight: 700; }
  input, textarea, select {
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 10px;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--gold);
  }
  textarea { resize: vertical; min-height: 60px; line-height: 1.4; }
  label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field { margin-bottom: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1.2fr 1.5fr 1fr; gap: 10px; }

  header.top {
    position: sticky; top: 0; z-index: 20;
    background: var(--navy);
    color: #F4F1E6;
    padding: 12px 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    display: flex; align-items: center; gap: 12px;
  }
  header.top img.brand-logo { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; border-radius: 4px; }
  header.top .heading-text { flex: 1; min-width: 0; }
  header.top .eyebrow {
    font-size: 12px;
    color: #C9D2E6;
    margin-bottom: 2px;
  }
  header.top h1 { font-size: 19px; letter-spacing: 0.2px; }

  main { max-width: 640px; margin: 0 auto; padding: 16px 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
  }
  .card > h2 {
    font-size: 15px;
    color: var(--navy);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--navy-tint);
  }

  .store {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    background: var(--card);
  }
  .store-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    background: var(--gold-tint);
    cursor: pointer;
  }
  .store-head .num {
    background: var(--gold);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .store-head .title {
    flex: 1;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--gold-dark);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .store-head .chev { color: var(--gold-dark); font-size: 13px; }
  .store-body { padding: 14px; border-top: 1px solid var(--line); }

  .icon-btn {
    border: none; background: transparent;
    color: var(--danger);
    font-size: 18px;
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .subsection { margin-top: 16px; }
  .subsection > .subhead {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 8px;
  }
  .entry {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
    margin-bottom: 8px;
  }
  .entry-top { display: flex; gap: 8px; align-items: flex-start; }
  .entry-top textarea, .entry-top input { flex: 1; }
  .photos-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .thumb { position: relative; width: 56px; height: 56px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .rm {
    position: absolute; top: -1px; right: -1px;
    background: rgba(156,59,59,0.92); color: #fff;
    width: 18px; height: 18px; border-radius: 50%;
    font-size: 12px; line-height: 18px; text-align: center;
    cursor: pointer;
  }
  .add-photo-btn {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--navy);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 6px 10px;
    margin-top: 8px;
    cursor: pointer;
    background: var(--navy-tint);
  }
  .add-photo-btn input { display: none; }

  .btn {
    display: inline-block;
    border: none; border-radius: var(--radius);
    padding: 9px 14px;
    font-size: 13.5px; font-weight: 600;
    cursor: pointer;
  }
  .btn-add {
    background: var(--navy-tint); color: var(--navy);
    border: 1px solid var(--navy);
  }
  .btn-add-store {
    width: 100%;
    background: var(--card); color: var(--gold-dark);
    border: 1.5px dashed var(--gold);
    padding: 12px; font-size: 14px;
  }
  .btn-remove-entry {
    background: transparent; color: var(--danger);
    border: none; font-size: 13px; padding: 6px 4px;
  }

  footer.bottom {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 10px 14px;
    display: flex; justify-content: center;
    z-index: 20;
  }
  .btn-generate {
    background: var(--red);
    color: #fff;
    width: 100%; max-width: 612px;
    padding: 14px; font-size: 15.5px; font-weight: 700;
    border-radius: var(--radius);
    box-shadow: 0 2px 6px rgba(226,7,25,0.35);
  }
  .btn-generate:disabled { opacity: 0.6; }
  .hint { font-size: 12px; color: var(--ink-soft); text-align: center; margin-top: 8px; }
  .status { font-size: 12.5px; text-align: center; margin-top: 8px; min-height: 16px; }
  .status.ok { color: var(--navy); }
  .status.err { color: var(--danger); }
  .tips-box {
    background: var(--gold-tint);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .tips-box summary { cursor: pointer; font-weight: 600; color: var(--gold-dark); }
  .tips-box .tips-body { margin-top: 8px; line-height: 1.5; }
  .tips-box .tips-body div { margin-bottom: 5px; }
  .tips-box .tips-formula { font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .tips-box .tips-vocab { margin-top: 6px; font-style: italic; }
</style>
</head>

  function loadScriptOnce(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error('Falha ao carregar: ' + url)); };
      document.head.appendChild(s);
    });
  }

  function loadFirstAvailable(urls) {
    function attempt(i) {
      if (i >= urls.length) return Promise.reject(new Error('Nenhuma fonte disponível para: ' + urls[0]));
      return loadScriptOnce(urls[i]).catch(function () { return attempt(i + 1); });
    }
    return attempt(0);
  }

  function findFileByName(name) {
    var q = encodeURIComponent("name = '" + name.replace(/'/g, "\\'") + "' and trashed = false");
    return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&spaces=drive&fields=files(id,name)')
      .then(function (res) { return res.json(); })
      .then(function (data) { return (data.files && data.files[0]) || null; });
  }

  function saveJSONFile(name, obj, existingId) {
    var boundary = 'foo_bar_baz_' + Math.random().toString(36).slice(2);
    var metadata = { name: name, mimeType: 'application/json' };
    var body = '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: application/json\r\n\r\n' +
      JSON.stringify(obj) + '\r\n' +
      '--' + boundary + '--';
    var url = existingId
      ? 'https://www.googleapis.com/upload/drive/v3/files/' + existingId + '?uploadType=multipart'
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    return driveFetch(url, {
      method: existingId ? 'PATCH' : 'POST',
      headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
      body: body
    }).then(function (res) { return res.json(); });
  }

  function buildDraftSnapshot() {
    return {
      meta: state.meta,
      stores: state.stores.map(function (s) {
        return {
          nome: s.nome, contatoCargo: s.contatoCargo, contatoNome: s.contatoNome, contatoTelefone: s.contatoTelefone,
          observacoes: s.observacoes.map(function (o) { return { texto: o.texto, fotoCount: o.fotos.length }; }),
          precos: s.precos,
          alertas: s.alertas.map(function (a) { return { texto: a.texto, fotoCount: a.fotos.length }; }),
          oportunidades: s.oportunidades,
          leituraEstrategica: s.leituraEstrategica
        };
      })
    };
  }

  function scheduleAutosave() {
    if (!driveAccessToken) return;
    clearTimeout(autosaveTimer);
    setDriveStatus('Alterações pendentes...');
    autosaveTimer = setTimeout(function () {
      setDriveStatus('Salvando rascunho...');
      var name = draftFileName();
      findFileByName(name).then(function (existing) {
        return saveJSONFile(name, buildDraftSnapshot(), existing ? existing.id : null);
      }).then(function () {
        var now = new Date();
        setDriveStatus('Rascunho salvo às ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + '.');
      }).catch(function (err) {
        console.error(err);
        setDriveStatus('Não consegui salvar o rascunho agora. Vai tentar de novo na próxima alteração.');
      });
    }, 3000);
  }

  function tryRestoreDraftForToday() {
    var name = draftFileName();
    findFileByName(name).then(function (existing) {
      if (!existing) return;
      var temEntradaReal = state.stores.some(function (s) { return s.nome || s.observacoes.some(function (o) { return o.texto; }); });
      if (temEntradaReal) return;
      return driveFetch('https://www.googleapis.com/drive/v3/files/' + existing.id + '?alt=media')
        .then(function (res) { return res.json(); })
        .then(function (draft) {
          if (!confirm('Encontrei um rascunho salvo de hoje (' + state.meta.data + '). Deseja continuar de onde parou?')) return;
          state.meta = draft.meta || state.meta;
          state.stores = (draft.stores || []).map(function (s) {
            return {
              id: uid(), aberta: false,
              nome: s.nome || '', contatoCargo: s.contatoCargo || '', contatoNome: s.contatoNome || '', contatoTelefone: s.contatoTelefone || '',
              observacoes: (s.observacoes || []).map(function (o) {
                var obs = newObservacao(); obs.texto = o.texto || '';
                if (o.fotoCount) obs.texto += (obs.texto ? '\n' : '') + '[' + o.fotoCount + ' foto(s) do rascunho — anexe novamente]';
                return obs;
              }),
              precos: s.precos || [],
              alertas: (s.alertas || []).map(function (a) {
                var al = newAlerta(); al.texto = a.texto || '';
                if (a.fotoCount) al.texto += (al.texto ? '\n' : '') + '[' + a.fotoCount + ' foto(s) do rascunho — anexe novamente]';
                return al;
              }),
              oportunidades: s.oportunidades || [],
              leituraEstrategica: s.leituraEstrategica || ''
            };
          });
          if (state.stores.length) state.stores[state.stores.length - 1].aberta = true;
          else state.stores.push(newStore());
          renderMeta();
          renderStores();
        });
    }).catch(function (err) { console.error(err); });
  }

  function getOrCreateReportsFolder() {
    if (reportsFolderIdCache) return Promise.resolve(reportsFolderIdCache);
    var q = encodeURIComponent("name = '" + REPORTS_FOLDER_NAME + "' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
    return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&spaces=drive&fields=files(id,name)')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.files && data.files[0]) { reportsFolderIdCache = data.files[0].id; return reportsFolderIdCache; }
        return driveFetch('https://www.googleapis.com/drive/v3/files', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: REPORTS_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
        }).then(function (res) { return res.json(); }).then(function (folder) {
          reportsFolderIdCache = folder.id;
          return reportsFolderIdCache;
        });
      });
  }

  function uploadDocxToDrive(blob, filename) {
    if (!driveAccessToken) return Promise.resolve(false);
    return getOrCreateReportsFolder().then(function (folderId) {
      return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify({ name: filename, parents: [folderId] })
      });
    }).then(function (initRes) {
      var uploadUrl = initRes.headers.get('Location');
      return fetch(uploadUrl, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' },
        body: blob
      });
    }).then(function (res) { return res.ok; })
      .then(function (ok) {
        if (ok) {
          return findFileByName(draftFileName()).then(function (existing) {
            if (existing) return driveFetch('https://www.googleapis.com/drive/v3/files/' + existing.id, { method: 'DELETE' });
          }).then(function () { return true; });
        }
        return false;
      }).catch(function (err) { console.error(err); return false; });
  }

  // ---------- image compression ----------
  function fileToImageEl(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () { resolve({ img: img, url: url }); };
      img.onerror = function (e) { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  function compressImage(file, maxDim, quality) {
    maxDim = maxDim || 1400;
    quality = quality || 0.75;
    return fileToImageEl(file).then(function (loaded) {
      var img = loaded.img;
      var scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      var w = Math.max(1, Math.round(img.naturalWidth * scale));
      var h = Math.max(1, Math.round(img.naturalHeight * scale));
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(loaded.url);
      return new Promise(function (resolve) {
        canvas.toBlob(function (blob) {
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          blob.arrayBuffer().then(function (buf) {
            resolve({ id: uid(), arrayBuffer: buf, width: w, height: h, dataUrl: dataUrl });
          });
        }, 'image/jpeg', quality);
      });
    });
  }

  // ---------- rendering ----------
  var metaFieldsEl = document.getElementById('meta-fields');
  var storesContainerEl = document.getElementById('stores-container');
  var statusEl = document.getElementById('status');

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  function textEl(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    e.textContent = text;
    return e;
  }

  function labeledInput(labelText, value, oninput, placeholder, type) {
    var wrap = el('div', { class: 'field' });
    wrap.appendChild(textEl('label', null, labelText));
    var input = el(type === 'textarea' ? 'textarea' : 'input', { placeholder: placeholder || '' });
    if (type && type !== 'textarea') input.setAttribute('type', type);
    input.value = value || '';
    input.addEventListener('input', function () { oninput(input.value); scheduleAutosave(); });
    wrap.appendChild(input);
    return wrap;
  }

  function renderMeta() {
    metaFieldsEl.innerHTML = '';
    metaFieldsEl.appendChild(labeledInput('Marca / Cliente', state.meta.marca, function (v) { state.meta.marca = v; }));
    var row = el('div', { class: 'row2' });
    var dataField = labeledInput('Data', state.meta.data, function (v) { state.meta.data = v; }, '', 'date');
    var respField = labeledInput('Responsável', state.meta.responsavel, function (v) { state.meta.responsavel = v; });
    row.appendChild(dataField); row.appendChild(respField);
    metaFieldsEl.appendChild(row);
    var row2 = el('div', { class: 'row2' });
    var cidadeField = labeledInput('Cidade / Região', state.meta.cidadeRegiao, function (v) { state.meta.cidadeRegiao = v; }, 'Ex: Sumaré e Paulínia');
    var setorField = labeledInput('Setor', state.meta.setor, function (v) { state.meta.setor = v; }, 'Ex: Miguel e José Renato');
    row2.appendChild(cidadeField); row2.appendChild(setorField);
    metaFieldsEl.appendChild(row2);
  }

  function renderPhotosRow(fotos, onRemove) {
    var row = el('div', { class: 'photos-row' });
    fotos.forEach(function (foto, idx) {
      var thumb = el('div', { class: 'thumb' });
      var img = el('img'); img.src = foto.dataUrl;
      var rm = el('div', { class: 'rm' }, []); rm.textContent = '×';
      rm.addEventListener('click', function () { onRemove(idx); });
      thumb.appendChild(img); thumb.appendChild(rm);
      row.appendChild(thumb);
    });
    return row;
  }

  function renderPhotoAdder(onFiles) {
    function makeButton(text, useCameraCapture) {
      var label = el('label', { class: 'add-photo-btn' });
      label.textContent = text;
      var attrs = { type: 'file', accept: 'image/*', multiple: 'multiple' };
      if (useCameraCapture) attrs.capture = 'environment';
      var input = el('input', attrs);
      input.addEventListener('change', function (e) {
        var files = Array.prototype.slice.call(e.target.files || []);
        if (!files.length) return;
        label.textContent = 'Processando...';
        Promise.all(files.map(function (f) { return compressImage(f); })).then(function (fotos) {
          onFiles(fotos);
          label.textContent = text;
          input.value = '';
        });
      });
      label.appendChild(input);
      return label;
    }
    var wrap = el('div', { style: 'display:flex; gap:8px; flex-wrap:wrap;' });
    wrap.appendChild(makeButton('📷 Tirar foto', true));
    wrap.appendChild(makeButton('🖼️ Escolher da galeria', false));
    return wrap;
  }

  function renderStores() {
    storesContainerEl.innerHTML = '';
    state.stores.forEach(function (store, storeIdx) {
      storesContainerEl.appendChild(renderStore(store, storeIdx));
    });
    scheduleAutosave();
  }

  function renderStore(store, storeIdx) {
    var wrap = el('div', { class: 'store' });

    var head = el('div', { class: 'store-head' });
    var num = el('div', { class: 'num' }, []); num.textContent = String(storeIdx + 1);
    var title = el('div', { class: 'title' }, []);
    title.textContent = store.nome ? store.nome : ('Loja ' + (storeIdx + 1) + ' (sem nome)');
    var chev = el('div', { class: 'chev' }, []); chev.textContent = store.aberta ? '▲' : '▼';
    var rmStore = el('button', { class: 'icon-btn', title: 'Remover loja' }, []); rmStore.textContent = '🗑';
    rmStore.addEventListener('click', function (e) {
      e.stopPropagation();
      if (confirm('Remover esta loja e todos os dados preenchidos?')) {
        state.stores.splice(storeIdx, 1);
        renderStores();
      }
    });
    head.appendChild(num); head.appendChild(title); head.appendChild(chev); head.appendChild(rmStore);
    head.addEventListener('click', function () { store.aberta = !store.aberta; renderStores(); });
    wrap.appendChild(head);

    if (!store.aberta) return wrap;

    var body = el('div', { class: 'store-body' });

    // nome + contato
    body.appendChild(labeledInput('Nome do supermercado', store.nome, function (v) {
      store.nome = v; title.textContent = v ? v : ('Loja ' + (storeIdx + 1) + ' (sem nome)');
    }, 'Ex: Supermercado Good Bom Jd. Bom Retiro'));

    var row3 = el('div', { class: 'row3' });
    row3.appendChild(labeledInput('Cargo do contato', store.contatoCargo, function (v) { store.contatoCargo = v; }, 'Ex: Gerente'));
    row3.appendChild(labeledInput('Nome do contato', store.contatoNome, function (v) { store.contatoNome = v; }, 'Ex: Luciano Garcia'));
    row3.appendChild(labeledInput('Telefone', store.contatoTelefone, function (v) { store.contatoTelefone = v; }, '(19) 99999-9999'));
    body.appendChild(row3);

    // Ações e observações
    body.appendChild(renderListSection({
      title: 'Ações e observações',
      guiaKey: 'observacoes',
      items: store.observacoes,
      placeholder: 'Ex: O Arborio está bem abastecido e com bom posicionamento...',
      withPhotos: true,
      onAdd: function () { store.observacoes.push(newObservacao()); renderStores(); },
      onRemove: function (i) { store.observacoes.splice(i, 1); renderStores(); }
    }));

    // Preços
    body.appendChild(renderPrecosSection(store));

    // Alertas
    body.appendChild(renderListSection({
      title: 'Alertas',
      guiaKey: 'alertas',
      items: store.alertas,
      placeholder: 'Ex: Sortimento reduzido limita oportunidades de crescimento...',
      withPhotos: true,
      onAdd: function () { store.alertas.push(newAlerta()); renderStores(); },
      onRemove: function (i) { store.alertas.splice(i, 1); renderStores(); }
    }));

    // Oportunidades
    body.appendChild(renderListSection({
      title: 'Oportunidades',
      guiaKey: 'oportunidades',
      items: store.oportunidades,
      placeholder: 'Ex: Avaliar ampliação do sortimento na rede...',
      withPhotos: false,
      onAdd: function () { store.oportunidades.push(newOportunidade()); renderStores(); },
      onRemove: function (i) { store.oportunidades.splice(i, 1); renderStores(); }
    }));

    // Leitura estratégica
    var lea = el('div', { class: 'subsection' });
    lea.appendChild(textEl('div', 'subhead', 'Leitura estratégica'));
    var leaTips = renderTipsBox('leitura');
    if (leaTips) lea.appendChild(leaTips);
    var leaField = el('textarea', { placeholder: 'Resumo da leitura estratégica da loja...' });
    leaField.value = store.leituraEstrategica || '';
    leaField.style.minHeight = '90px';
    leaField.addEventListener('input', function () { store.leituraEstrategica = leaField.value; scheduleAutosave(); });
    lea.appendChild(leaField);
    body.appendChild(lea);

    wrap.appendChild(body);
    return wrap;
  }

  function renderListSection(opts) {
    var section = el('div', { class: 'subsection' });
    var subhead = el('div', { class: 'subhead' }); subhead.textContent = opts.title;
    section.appendChild(subhead);
    var tips = renderTipsBox(opts.guiaKey);
    if (tips) section.appendChild(tips);

    opts.items.forEach(function (item, idx) {
      var entry = el('div', { class: 'entry' });
      var top = el('div', { class: 'entry-top' });
      var ta = el('textarea', { placeholder: opts.placeholder });
      ta.value = item.texto || '';
      ta.addEventListener('input', function () { item.texto = ta.value; scheduleAutosave(); });
      var rm = el('button', { class: 'btn-remove-entry' }, []); rm.textContent = '✕';
      rm.addEventListener('click', function () { opts.onRemove(idx); });
      top.appendChild(ta); top.appendChild(rm);
      entry.appendChild(top);

      if (opts.withPhotos) {
        if (item.fotos.length) {
          entry.appendChild(renderPhotosRow(item.fotos, function (photoIdx) {
            item.fotos.splice(photoIdx, 1);
            renderStores();
          }));
        }
        entry.appendChild(renderPhotoAdder(function (fotos) {
          item.fotos = item.fotos.concat(fotos);
          renderStores();
        }));
      }
      section.appendChild(entry);
    });

    var addBtn = el('button', { class: 'btn btn-add' }, []);
    addBtn.textContent = '+ Adicionar';
    addBtn.addEventListener('click', opts.onAdd);
    section.appendChild(addBtn);
    return section;
  }

  function renderPrecosSection(store) {
    var section = el('div', { class: 'subsection' });
    var subhead = el('div', { class: 'subhead' }); subhead.textContent = 'Preços';
    section.appendChild(subhead);
    var precoTips = renderTipsBox('precos');
    if (precoTips) section.appendChild(precoTips);

    store.precos.forEach(function (preco, idx) {
      var entry = el('div', { class: 'entry' });
      var top = el('div', { class: 'entry-top' });
      var prodInput = el('input', { placeholder: 'Produto (ex: Pilecco Nobre 1kg)' });
      prodInput.value = preco.produto || '';
      prodInput.addEventListener('input', function () { preco.produto = prodInput.value; scheduleAutosave(); });
      var valorInput = el('input', { placeholder: 'Valor (ex: R$ 5,99 ou Ruptura)' });
      valorInput.value = preco.valor || '';
      valorInput.addEventListener('input', function () { preco.valor = valorInput.value; scheduleAutosave(); });
      var rm = el('button', { class: 'btn-remove-entry' }, []); rm.textContent = '✕';
      rm.addEventListener('click', function () { store.precos.splice(idx, 1); renderStores(); });
      top.appendChild(prodInput);
      top.appendChild(valorInput);
      top.appendChild(rm);
      entry.appendChild(top);

      var ofertaRow = el('label', { style: 'display:flex; align-items:center; gap:6px; margin-top:8px; font-size:13px; color:var(--ink-soft); cursor:pointer;' });
      var ofertaCheck = el('input', { type: 'checkbox' });
      ofertaCheck.style.width = 'auto';
      ofertaCheck.checked = !!preco.oferta;
      ofertaCheck.addEventListener('change', function () { preco.oferta = ofertaCheck.checked; renderStores(); });
      ofertaRow.appendChild(ofertaCheck);
      ofertaRow.appendChild(document.createTextNode('Oferta'));
      entry.appendChild(ofertaRow);

      if (preco.oferta) {
        var ofertaValorInput = el('input', { placeholder: 'Valor da oferta (ex: R$ 4,99)' });
        ofertaValorInput.style.marginTop = '8px';
        ofertaValorInput.value = preco.valorOferta || '';
        ofertaValorInput.addEventListener('input', function () { preco.valorOferta = ofertaValorInput.value; scheduleAutosave(); });
        entry.appendChild(ofertaValorInput);
      }

      section.appendChild(entry);
    });

    var addBtn = el('button', { class: 'btn btn-add' }, []);
    addBtn.textContent = '+ Adicionar preço';
    addBtn.addEventListener('click', function () { store.precos.push(newPreco()); renderStores(); });
    section.appendChild(addBtn);
    return section;
  }

  document.getElementById('btn-add-store').addEventListener('click', function () {
    state.stores.forEach(function (s) { s.aberta = false; });
    state.stores.push(newStore());
    renderStores();
  });

  // ---------- docx generation ----------
  function slug(s) {
    return (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'relatorio';
  }

  function formatDataBR(iso) {
    if (!iso) return '';
    var parts = iso.split('-');
    if (parts.length !== 3) return iso;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function base64ToArrayBuffer(base64) {
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  function buildPhotosParagraph(D, fotos) {
    var n = fotos.length;
    if (!n) return null;
    var maxTotal = 520;
    var perW = Math.min(360, Math.floor(maxTotal / n) - 8);
    var children = [];
    fotos.forEach(function (foto, i) {
      var w = Math.min(perW, foto.width);
      var h = Math.round(w * (foto.height / foto.width));
      children.push(new D.ImageRun({ data: foto.arrayBuffer, transformation: { width: w, height: h }, type: 'jpg' }));
      if (i < n - 1) children.push(new D.TextRun({ text: '   ' }));
    });
    return new D.Paragraph({ children: children, alignment: D.AlignmentType.CENTER, spacing: { after: 160 } });
  }

  function buildDocx() {
    var D = window.docx;
    var children = [];

    // Title
    children.push(new D.Paragraph({
      children: [new D.TextRun({ text: 'RELATÓRIO DE VISITA — ' + (state.meta.marca || '').toUpperCase(), bold: true, size: 26, font: 'Arial' })],
      alignment: D.AlignmentType.CENTER,
      spacing: { after: 200 }
    }));

    function metaLine(label, value) {
      return new D.Paragraph({
        children: [
          new D.TextRun({ text: label + ': ', bold: true, size: 24, font: 'Arial' }),
          new D.TextRun({ text: value || '-', size: 24, font: 'Arial' })
        ],
        spacing: { after: 40 }
      });
    }
    children.push(metaLine('Data', formatDataBR(state.meta.data)));
    children.push(metaLine('Responsável', state.meta.responsavel));
    children.push(metaLine('Cidade/Região', state.meta.cidadeRegiao));
    children.push(metaLine('Setor', state.meta.setor));
    children.push(new D.Paragraph({ text: '', spacing: { after: 200 } }));

    state.stores.forEach(function (store, idx) {
      var contatoParts = [];
      if (store.contatoCargo || store.contatoNome) {
        var c = 'Contato';
        if (store.contatoCargo) c += ' ' + store.contatoCargo;
        if (store.contatoNome) c += ': ' + store.contatoNome;
        if (store.contatoTelefone) c += ' (' + store.contatoTelefone + ')';
        contatoParts.push(c);
      }
      var headingText = (idx + 1) + '. ' + (store.nome || 'SEM NOME').toUpperCase() +
        (contatoParts.length ? '  ' + contatoParts.join(' ') : '');

      children.push(new D.Paragraph({
        children: [new D.TextRun({ text: headingText, bold: true, size: 26, color: '0A3679', font: 'Arial' })],
        spacing: { before: 240, after: 120 },
        border: { bottom: { color: 'E3E9F4', space: 4, style: D.BorderStyle.SINGLE, size: 8 } }
      }));

      function subhead(text) {
        children.push(new D.Paragraph({
          children: [new D.TextRun({ text: text, bold: true, size: 26, font: 'Arial' })],
          spacing: { before: 160, after: 80 }
        }));
      }

      if (store.observacoes.some(function (o) { return o.texto || o.fotos.length; })) {
        subhead('Ações e observações');
        store.observacoes.forEach(function (o) {
          if (!o.texto && !o.fotos.length) return;
          if (o.texto) children.push(new D.Paragraph({ children: [new D.TextRun({ text: o.texto, size: 24, font: 'Arial' })], spacing: { after: 80 } }));
          var photoPara = buildPhotosParagraph(D, o.fotos);
          if (photoPara) children.push(photoPara);
        });
      }

      if (store.precos.length) {
        subhead('Preços');
        store.precos.forEach(function (p) {
          if (!p.produto && !p.valor) return;
          var runs = [new D.TextRun({ text: (p.produto || '') + ': ', bold: true, size: 24, font: 'Arial' })];
          if (p.oferta && p.valorOferta) {
            runs.push(new D.TextRun({ text: 'De ' + (p.valor || '') + ' por ', size: 24, font: 'Arial' }));
            runs.push(new D.TextRun({ text: p.valorOferta, bold: true, size: 24, font: 'Arial' }));
            runs.push(new D.TextRun({ text: '  OFERTA', bold: true, color: 'D9A600', size: 24, font: 'Arial' }));
          } else {
            runs.push(new D.TextRun({ text: p.valor || '', size: 24, font: 'Arial' }));
            if (p.oferta) runs.push(new D.TextRun({ text: '  OFERTA', bold: true, color: 'D9A600', size: 24, font: 'Arial' }));
          }
          children.push(new D.Paragraph({ children: runs, spacing: { after: 40 } }));
        });
      }

      if (store.alertas.some(function (a) { return a.texto || a.fotos.length; })) {
        subhead('Alertas');
        store.alertas.forEach(function (a) {
          if (!a.texto && !a.fotos.length) return;
          if (a.texto) children.push(new D.Paragraph({ children: [new D.TextRun({ text: a.texto, size: 24, font: 'Arial' })], numbering: { reference: 'bullet-list', level: 0 }, spacing: { after: 80 } }));
          var photoPara = buildPhotosParagraph(D, a.fotos);
          if (photoPara) children.push(photoPara);
        });
      }

      if (store.oportunidades.some(function (o) { return o.texto; })) {
        subhead('Oportunidades');
        store.oportunidades.forEach(function (o) {
          if (!o.texto) return;
          children.push(new D.Paragraph({ children: [new D.TextRun({ text: o.texto, size: 24, font: 'Arial' })], numbering: { reference: 'bullet-list', level: 0 }, spacing: { after: 80 } }));
        });
      }

      if (store.leituraEstrategica && store.leituraEstrategica.trim()) {
        subhead('Leitura estratégica');
        store.leituraEstrategica.split('\n').forEach(function (line) {
          if (line.trim()) children.push(new D.Paragraph({ children: [new D.TextRun({ text: line, size: 24, font: 'Arial' })], spacing: { after: 80 } }));
        });
      }
    });

    var doc = new D.Document({
      styles: {
        default: {
          document: { run: { font: 'Arial', size: 24 } }
        }
      },
      numbering: {
        config: [{
          reference: 'bullet-list',
          levels: [{
            level: 0,
            format: D.LevelFormat.BULLET,
            text: '•',
            alignment: D.AlignmentType.LEFT,
            style: { paragraph: { indent: { left: 360, hanging: 360 } } }
          }]
        }]
      },
      sections: [{
        properties: {},
        headers: {
          default: new D.Header({
            children: [new D.Paragraph({
              children: [new D.ImageRun({ data: base64ToArrayBuffer(LOGO_BASE64_PNG), transformation: { width: 38, height: 50 }, type: 'png' })],
              alignment: D.AlignmentType.LEFT
            })]
          })
        },
        children: children
      }]
    });

    return D.Packer.toBlob(doc);
  }

  function gerarRelatorio() {
    var btn = document.getElementById('btn-generate');
    btn.disabled = true;
    statusEl.className = 'status';
    statusEl.textContent = 'Gerando documento...';
    buildDocx().then(function (blob) {
      var filename = 'Relatorio_Visita_' + slug(state.meta.cidadeRegiao) + '_' + (state.meta.data || todayISO()) + '.docx';
      window.saveAs(blob, filename);
      statusEl.className = 'status ok';
      statusEl.textContent = 'Relatório gerado: ' + filename;
      btn.disabled = false;
      if (driveAccessToken) {
        statusEl.textContent += ' — enviando cópia pro Drive...';
        uploadDocxToDrive(blob, filename).then(function (ok) {
          statusEl.textContent = 'Relatório gerado: ' + filename + (ok ? ' (salvo no Drive também)' : ' (não consegui salvar no Drive)');
        });
      }
    }).catch(function (err) {
      console.error(err);
      statusEl.className = 'status err';
      statusEl.textContent = 'Erro ao gerar o relatório. Tente novamente.';
      btn.disabled = false;
    });
  }

  document.getElementById('btn-generate').addEventListener('click', function () {
    if (!state.stores.length) {
      statusEl.className = 'status err';
      statusEl.textContent = 'Adicione ao menos uma loja antes de gerar o relatório.';
      return;
    }
    if (librariesReady) {
      gerarRelatorio();
      return;
    }
    statusEl.className = 'status';
    statusEl.textContent = 'Tentando carregar os componentes novamente...';
    initLibraries().then(function () {
      if (librariesReady) {
        gerarRelatorio();
      } else {
        statusEl.className = 'status err';
        statusEl.textContent = 'Ainda não consegui carregar os componentes. Verifique sua internet e tente novamente.';
      }
    });
  });

  // ---------- init ----------
  renderMeta();
  state.stores.push(newStore());
  renderStores();
  initLibraries();
  initGoogleAuth();
})();
</script>
</body>
</html>
